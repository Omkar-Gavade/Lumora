# Development and staging infrastructure for Lumora.
#
# This file exists because M7 found the services running as hand-rolled
# `docker run` containers with no recorded configuration — which is how
# `lumora-chroma` ended up with **no volume at all**, holding the entire vector
# index in its container writable layer. That survives `docker restart` and
# dies with `docker rm`, so the index was one routine cleanup away from being
# silently lost. Postgres was on an *anonymous* volume, which is the same
# hazard wearing a disguise: the data persists, but under a hash nobody can
# recognise, so it is orphaned by the same cleanup and invisible to
# `docker volume ls` when you go looking for it.
#
# Both are named volumes here. That is the whole point of the file.
#
# The application itself is deliberately **not** a service: docs/06-roadmap.md
# §5 lists containerization of the app under "infrastructure, deliberately
# excluded from this document". This covers the two stateful dependencies a
# developer must run and must not lose, and nothing else.

name: lumora

services:
  postgres:
    image: postgres:17-alpine
    container_name: lumora-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumora}
      POSTGRES_DB: ${POSTGRES_DB:-lumora}
      # No default. An unset password would start Postgres with trust auth on a
      # published port, which is a database open to anything that can reach the
      # host. Compose fails with "variable is not set" instead, which is the
      # correct outcome.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Bound to loopback, not 0.0.0.0. The hand-rolled container published on
      # every interface, which on a laptop joined to a coffee-shop network is a
      # publicly reachable database.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` alone reports the *server* is up while it is still
      # replaying WAL and refusing connections, so the migration step races it.
      # Naming the user and database makes this a real connection check.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lumora} -d ${POSTGRES_DB:-lumora}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  chroma:
    image: chromadb/chroma:1.0.0
    container_name: lumora-chroma
    restart: unless-stopped
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      # `/data` is the `persist_path` in the image's own /config.yaml. Verified
      # by reading it out of the running container rather than assumed — the
      # path moved between Chroma majors, and mounting the wrong one produces a
      # volume that stays empty while the index quietly fills the container
      # layer, which is the exact failure this file exists to prevent.
      - chroma-data:/data
    healthcheck:
      # `bash -c`, not `CMD-SHELL`. The image's /bin/sh is dash, which has no
      # /dev/tcp, so the shell-form check fails with "Directory nonexistent" on
      # a Chroma that is perfectly healthy — an always-red healthcheck, which
      # is worse than none because it trains you to ignore it. The image ships
      # no curl, wget, or python, so /dev/tcp under bash is the only HTTP
      # client available in here.
      #
      # v2 endpoint: v1 returns 410 Gone on 1.0.0.
      test:
        [
          'CMD',
          'bash',
          '-c',
          'exec 3<>/dev/tcp/127.0.0.1/8000 && printf "GET /api/v2/heartbeat HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -1 <&3 | grep -q 200',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
    name: lumora-postgres-data
  chroma-data:
    name: lumora-chroma-data
