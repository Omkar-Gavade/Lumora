<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumora — Ask your documents anything</title>
    <meta
      name="description"
      content="Lumora reads your PDFs, contracts, and notes, then answers questions about them — with citations pointing to the exact passage it used."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lumora — Ask your documents anything" />
    <meta
      property="og:description"
      content="Grounded answers from your own documents, with citations you can click and verify."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Only the latin subsets are preloaded; latin-ext loads on demand. -->
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/source-serif-4-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script>
      // Resolve theme before first paint. Without this the page flashes light
      // then repaints dark, which is the single most visible polish failure.
      (function () {
        try {
          var stored = localStorage.getItem('lumora-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          /* private mode — fall back to the light default already on <html> */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
